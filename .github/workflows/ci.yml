name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Downloads Olist (checked by SHA-256), builds both databases and recomputes the expected answers.
      - run: metricbench build
      - run: pytest -q
      # Which reading of the question explains each wrong answer in runs/. Calls no model.
      - name: Causes of the wrong answers
        run: metricbench causes --list --json benchmark/causes.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: causes
          path: benchmark/causes.json
