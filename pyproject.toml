[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metricbench"
version = "0.1.0"
description = "Can an AI agent answer business questions correctly? Raw SQL vs. a semantic layer, on real e-commerce data with known answers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ney Fred Jiménez Campos" }]
dependencies = [
    "duckdb>=1.5,<2",
    "dbt-metricflow[dbt-duckdb]==0.15.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
metricbench = "metricbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["metricbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
